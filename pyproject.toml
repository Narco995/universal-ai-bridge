[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-bridge"
version = "0.1.0"
description = "Minimal auditable collaboration workflow for Universal AI Bridge"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]

[project.scripts]
uab = "universal_ai_bridge.cli:main"
uab-mcp = "universal_ai_bridge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP035", "RUF012", "TRY004", "BLE001", "SIM117"]
